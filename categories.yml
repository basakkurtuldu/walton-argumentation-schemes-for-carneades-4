# Which schemes of walton.yml go into which category file. The category files
# are generated from walton.yml and this file by tools/build_category_files.py;
# the grouping follows Walton, Reed & Macagno (2008), Argumentation Schemes.
# Every scheme of walton.yml must be listed exactly once.

A_reasoning/1_deductive-reasoning.yml:
  title: Reasoning - Deductive Reasoning
  schemes: [group_2, division_generic]

A_reasoning/2_inductive-reasoning.yml:
  title: Reasoning - Inductive Reasoning
  schemes: [group_1, composition_generic, part_in_whole, whole_into_parts]

A_reasoning/3_practical-reasoning.yml:
  title: Reasoning - Practical Reasoning
  schemes: [practical_reasoning1, practical_reasoning2, negative_consequences,
            positive_consequences, alternative_cognitive, alternative_normative,
            sacrifice, practical_inference, practical_necessary_condition,
            practical_sufficient_condition, practical_goal, end_and_means_1,
            end_and_means_2, end_and_means_3, two_person_practical, waste,
            negative_consequences_prudential, pragmatic_alternative, treat,
            ad_baculum, fear, danger, help, distress,
            negative_consequences_reasoning, sunk_costs]

A_reasoning/4_abductive-reasoning.yml:
  title: Reasoning - Abductive Reasoning
  schemes: [sign, abductive_backward, abductive_forward,
            abductive_action_to_character, abductive_character_to_action,
            retroductive, evidence_hypothesis_verification,
            evidence_hypothesis_falsification, abduction]

A_reasoning/5_casual-reasoning.yml:
  title: Reasoning - Causal Reasoning
  schemes: [slippery_slope_base_case, slippery_slope_inductive_step,
            opposition-descriptive_1, opposition-descriptive_2,
            opposition-descriptive_3, opposition-normative,
            rhetorical_oppositions_normative, rhetorical_oppositions_descriptive,
            interaction_act_person_1, interaction_act_person_2,
            full_slippery_slope, cause_to_effect, correlation_to_cause]

B_source-based-arguments/1_arguments-from-position-to-know.yml:
  title: Source-based Arguments - Arguments from Position to Know
  schemes: [position_to_know, witness_testimony, position_to_know_ad_populum,
            expert_opinion_ad_populum, negative_normal_expectations,
            negative_practical, epistemic_ignorence, memory, appearance,
            credible_source, expert_opinion, ignorance]

B_source-based-arguments/2_argumen-from-commitment.yml:
  title: Source-based Arguments - Arguments from Commitment
  schemes: [commitment1, commitment2, inconsistent_commitment, positive_value,
            negative_value]

B_source-based-arguments/3_attacking-personal-credibility.yml:
  title: Source-based Arguments - Arguments Attacking Personal Credibility
  schemes: [ad_hominem, pragmatic_inconsistency, circumstantial_ad_hominem, bias,
            bias_ad_hominem]

B_source-based-arguments/4_argumen-from-popular-acceptence.yml:
  title: Source-based Arguments - Arguments from Popular Acceptance
  schemes: [popular_opinion, pop_scheme, deliberation_ad_populum,
            moral_justification_ad_populum,
            moral_justification_ad_populum_excuse, snob_appeal_ad_populum,
            appeal_to_vanity_ad_populum, rhetoric_ad_populum,
            common_folk_ad_populum, common_folks_group_ad_populum,
            popular_practise, ethotic1, ethotic2]

C_applying-rules-to-cases/1_arguments-based-on-cases.yml:
  title: Applying Rules to Cases - Arguments Based on Cases
  schemes: [exeption_to_rule, from_example, illustration, from_model,
            from_antimodel, practical_analogy_positive,
            practical_analogy_negative, perception, analogy, established_rule]

C_applying-rules-to-cases/2_defeasible-rule-based-arguments.yml:
  title: Applying Rules to Cases - Defeasible Rule-based Arguments
  schemes: [rule_physical_world_1, rule_physical_world_2, rule_mental_world, rule,
            regulative_rule, exeptional, plea_for_excuse, defeasible_modus_ponens]

C_applying-rules-to-cases/3_chained-arguments-connecting-rules-and-cases.yml:
  title: Applying Rules to Cases - Chained Arguments Connecting Rules and Cases
  schemes: [gradualism, sorites_slippery_slope, verbal_slippery_slope]

C_applying-rules-to-cases/4_verbal_classification_arguments.yml:
  title: Applying Rules to Cases - Verbal Classification Arguments
  schemes: [verbal_classification, definition_to_verbal_classification,
            verbal_classification_vagueness, verbal_classification_arbitrariness]
